<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel del asesor | Primeros Pasos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand brand" href="index.html">Primeros Pasos</a>
      <div class="d-flex align-items-center gap-3">
        <span id="asesor" class="small text-muted"></span>
        <button id="btn-logout" class="btn btn-outline-dark btn-sm">Cerrar sesión</button>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div id="alertas"></div>
    <div class="row g-4">
      <section class="col-lg-4">
        <form id="form-ficha" class="auth-card" novalidate>
          <fieldset>
            <legend>Nueva ficha</legend>
            <label for="categoria" class="form-label">Categoría</label>
            <select id="categoria" class="form-select mb-3" required></select>
            <label for="titulo" class="form-label">Título</label>
            <input id="titulo" class="form-control mb-3" required maxlength="80" placeholder="Mejor coche para viaje">
            <label for="producto" class="form-label">Producto recomendado</label>
            <input id="producto" class="form-control mb-3" required maxlength="100">
            <label for="precio" class="form-label">Precio aproximado (S/)</label>
            <input id="precio" type="number" min="1" step="0.01" class="form-control mb-3" required>
            <label for="edad" class="form-label">Edad recomendada</label>
            <input id="edad" class="form-control mb-3" required maxlength="40" placeholder="0 a 3 años">
            <button type="submit" class="btn btn-brand w-100">Publicar ficha</button>
          </fieldset>
        </form>
      </section>
      <section class="col-lg-8">
        <h2 class="h4 mb-3">Fichas publicadas</h2>
        <div id="lista" class="card-grid"></div>
      </section>
    </div>
  </main>

  <script src="js/common.js"></script>
  <script src="js/panel.js"></script>
</body>
</html>
