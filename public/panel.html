<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi panel | Primeros Pasos</title>
  <meta name="description" content="Panel de asesores: publica y edita tus guías.">
  
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito+Sans:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-requiere-sesion="true">
  <div id="cabecera"></div>
  <main id="contenido" tabindex="-1">

    <section class="cabecera-pagina"><div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
      <div><h1 class="h2 mb-1">Mi panel</h1><p class="text-muted mb-0" id="saludo">Cargando…</p></div>
      <button type="button" class="btn btn-outline-secundario" id="salir">Cerrar sesión</button>
    </div></section>
    <section class="seccion pt-3"><div class="container">
      <ul class="nav nav-pills pestana-panel mb-4" role="tablist">
        <li class="nav-item" role="presentation"><button class="nav-link active" id="t-fichas" data-bs-toggle="pill" data-bs-target="#p-fichas" type="button" role="tab" aria-controls="p-fichas" aria-selected="true">Mis guías</button></li>
        <li class="nav-item" role="presentation"><button class="nav-link" id="t-mensajes" data-bs-toggle="pill" data-bs-target="#p-mensajes" type="button" role="tab" aria-controls="p-mensajes" aria-selected="false">Mensajes <span class="badge text-bg-secondary" id="n-mensajes">0</span></button></li>
      </ul>
      <div class="tab-content">
        <div class="tab-pane fade show active" id="p-fichas" role="tabpanel" aria-labelledby="t-fichas" tabindex="0">
          <div class="row g-4">
            <div class="col-lg-5">
              <form id="form-ficha" class="tarjeta-form" novalidate>
                <h2 class="h4" id="form-titulo">Nueva guía</h2>
                <div id="msg-ficha" role="alert" class="alert d-none"></div>
                <input type="hidden" id="ficha-id">
                <div class="row g-3">
                  <div class="col-6"><label class="form-label" for="categoria">Categoría</label><select id="categoria" class="form-select" required><option value="">Elige…</option></select></div>
                  <div class="col-6"><label class="form-label" for="etapa">Etapa</label><select id="etapa" class="form-select" required><option value="">Elige…</option></select></div>
                  <div class="col-12"><label class="form-label" for="titulo">Título</label><input id="titulo" class="form-control" required minlength="5" maxlength="80"></div>
                  <div class="col-12"><label class="form-label" for="producto">Producto</label><input id="producto" class="form-control" required minlength="3" maxlength="100"></div>
                  <div class="col-6"><label class="form-label" for="precio">Precio (S/)</label><input id="precio" type="number" class="form-control" required min="1" step="0.01" inputmode="decimal"></div>
                  <div class="col-6"><label class="form-label" for="edad">Edad recomendada</label><input id="edad" class="form-control" required maxlength="40" placeholder="Ej.: 0 a 4 años"></div>
                  <div class="col-12"><label class="form-label" for="descripcion">Descripción</label><textarea id="descripcion" class="form-control" rows="4" required minlength="10" maxlength="500"></textarea></div>
                </div>
                <div class="d-flex gap-2 mt-4"><button class="btn btn-principal" type="submit" id="guardar">Publicar guía</button><button class="btn btn-outline-secundario d-none" type="button" id="cancelar">Cancelar edición</button></div>
              </form>
            </div>
            <div class="col-lg-7">
              <h2 class="h4">Mis guías publicadas</h2>
              <div id="mis-fichas" class="d-grid gap-3" aria-live="polite"></div>
            </div>
          </div>
        </div>
        <div class="tab-pane fade" id="p-mensajes" role="tabpanel" aria-labelledby="t-mensajes" tabindex="0">
          <h2 class="visually-hidden">Mensajes recibidos</h2>
          <div id="mensajes" class="d-grid gap-3" aria-live="polite"></div>
        </div>
      </div>
    </div></section>
  </main>
  <div id="pie"></div>
  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/panel.js"></script>
</body>
</html>
