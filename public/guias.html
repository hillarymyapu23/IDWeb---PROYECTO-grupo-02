<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todas las guías | Primeros Pasos</title>
  <meta name="description" content="Busca y filtra guías de compra por categoría, etapa y precio.">
  
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito+Sans:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="cabecera"></div>
  <main id="contenido" tabindex="-1">

    <section class="cabecera-pagina"><div class="container"><h1 id="titulo-guias">Guías de compra</h1><p class="text-muted mb-0">Filtra por categoría y etapa, ordena por precio y compara hasta 3 guías.</p></div></section>
    <section class="seccion pt-3">
      <div class="container">
        <form id="filtros" class="filtros mb-3" role="search" aria-label="Filtrar guías">
          <div class="row g-3 align-items-end">
            <div class="col-md-6 col-lg-3"><label class="form-label" for="f-q">Buscar</label><input id="f-q" name="q" type="search" class="form-control" maxlength="60" placeholder="Ej.: cuna, coche, lluvia"></div>
            <div class="col-6 col-lg-2"><label class="form-label" for="f-c">Categoría</label><select id="f-c" name="c" class="form-select"><option value="">Todas</option></select></div>
            <div class="col-6 col-lg-2"><label class="form-label" for="f-e">Etapa</label><select id="f-e" name="etapa" class="form-select"><option value="">Todas</option></select></div>
            <div class="col-6 col-lg-2"><label class="form-label" for="f-o">Ordenar por</label><select id="f-o" name="orden" class="form-select"><option value="">Más recientes</option><option value="precio-asc">Precio: menor a mayor</option><option value="precio-desc">Precio: mayor a menor</option></select></div>
            <div class="col-6 col-lg-3 d-flex align-items-center justify-content-between gap-2">
              <div class="form-check mb-0"><input class="form-check-input" type="checkbox" id="f-fav" name="fav"><label class="form-check-label" for="f-fav">Solo favoritos</label></div>
              <button type="button" id="limpiar" class="btn btn-sm btn-outline-secundario">Limpiar</button>
            </div>
          </div>
        </form>
        <h2 class="visually-hidden">Resultados</h2>
        <p id="conteo" class="text-muted" role="status" aria-live="polite"></p>
        <div id="lista" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-4"></div>
        <div id="vacio" class="vacio" hidden></div>
      </div>
    </section>
  </main>
  <div id="pie"></div>
  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/guias.js"></script>
</body>
</html>
