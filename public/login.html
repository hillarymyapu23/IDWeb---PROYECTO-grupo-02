<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso de asesores | Primeros Pasos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand brand" href="index.html">Primeros Pasos</a>
      <a class="btn btn-outline-dark btn-sm" href="index.html">Ver guías</a>
    </div>
  </nav>

  <main class="container py-5">
    <div id="alertas" class="mx-auto" style="max-width:820px"></div>
    <div class="row g-4 justify-content-center">
      <section class="col-md-6 col-lg-5">
        <form id="form-login" class="auth-card" novalidate>
          <fieldset>
            <legend>Iniciar sesión</legend>
            <label for="login-email" class="form-label">Correo</label>
            <input type="email" id="login-email" class="form-control mb-3" required placeholder="asesor@correo.com">
            <label for="login-password" class="form-label">Contraseña</label>
            <input type="password" id="login-password" class="form-control mb-3" required minlength="6">
            <button type="submit" class="btn btn-brand w-100">Entrar</button>
          </fieldset>
        </form>
      </section>
      <section class="col-md-6 col-lg-5">
        <form id="form-register" class="auth-card" novalidate>
          <fieldset>
            <legend>Crear cuenta de asesor</legend>
            <label for="reg-email" class="form-label">Correo</label>
            <input type="email" id="reg-email" class="form-control mb-3" required>
            <label for="reg-password" class="form-label">Contraseña (mínimo 6 caracteres)</label>
            <input type="password" id="reg-password" class="form-control mb-3" required minlength="6">
            <button type="submit" class="btn btn-outline-dark w-100">Registrarme</button>
          </fieldset>
        </form>
      </section>
    </div>
  </main>

  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
