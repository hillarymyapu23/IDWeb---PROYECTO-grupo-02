<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso de asesores | Primeros Pasos</title>
  <meta name="description" content="Inicia sesión o crea tu cuenta de asesor para publicar guías.">
  
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito+Sans:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="cabecera"></div>
  <main id="contenido" tabindex="-1">

    <section class="seccion"><div class="container" style="max-width:560px">
      <h1 class="h2 mb-2">Acceso de asesores</h1>
      <p class="text-muted">Los asesores publican y editan las guías del portal. Leer las guías no requiere cuenta.</p>
      <div id="aviso-sesion" class="alert alert-warning" role="alert" hidden>Tu sesión expiró o no iniciaste sesión. Ingresa de nuevo para continuar.</div>
      <div class="tarjeta-form">
        <ul class="nav nav-pills pestana-panel mb-4" id="pestanas" role="tablist">
          <li class="nav-item" role="presentation"><button class="nav-link active" id="t-login" data-bs-toggle="pill" data-bs-target="#p-login" type="button" role="tab" aria-controls="p-login" aria-selected="true">Ingresar</button></li>
          <li class="nav-item" role="presentation"><button class="nav-link" id="t-registro" data-bs-toggle="pill" data-bs-target="#p-registro" type="button" role="tab" aria-controls="p-registro" aria-selected="false">Crear cuenta</button></li>
        </ul>
        <div class="tab-content">
          <div class="tab-pane fade show active" id="p-login" role="tabpanel" aria-labelledby="t-login" tabindex="0">
            <form id="form-login" novalidate>
              <div id="msg-login" role="alert" class="alert alert-danger d-none"></div>
              <div class="mb-3"><label class="form-label" for="l-email">Correo</label><input id="l-email" name="email" type="email" class="form-control" required autocomplete="username"></div>
              <div class="mb-3"><label class="form-label" for="l-pass">Contraseña</label><input id="l-pass" name="password" type="password" class="form-control" required autocomplete="current-password"></div>
              <button class="btn btn-principal w-100" type="submit">Ingresar</button>
            </form>
          </div>
          <div class="tab-pane fade" id="p-registro" role="tabpanel" aria-labelledby="t-registro" tabindex="0">
            <form id="form-registro" novalidate>
              <div id="msg-registro" role="alert" class="alert alert-danger d-none"></div>
              <div class="mb-3"><label class="form-label" for="r-nombre">Nombre</label><input id="r-nombre" name="nombre" class="form-control" required minlength="2" maxlength="60" autocomplete="name"></div>
              <div class="mb-3"><label class="form-label" for="r-email">Correo</label><input id="r-email" name="email" type="email" class="form-control" required autocomplete="email"></div>
              <div class="mb-3"><label class="form-label" for="r-pass">Contraseña</label><input id="r-pass" name="password" type="password" class="form-control" required minlength="8" maxlength="72" autocomplete="new-password" aria-describedby="r-ayuda"><div id="r-ayuda" class="form-text">Mínimo 8 caracteres.</div></div>
              <button class="btn btn-principal w-100" type="submit">Crear cuenta e ingresar</button>
            </form>
          </div>
        </div>
      </div>
    </div></section>
  </main>
  <div id="pie"></div>
  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
